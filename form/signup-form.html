<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Pet Store</title>
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <main class="auth-page">
        <form class="auth-form" action="../index.html">
            <h1>Create your account</h1>
            <p class="auth-intro">Join Pet Store for everything your pet needs.</p>
            <label for="full-name">Full name</label>
            <input id="full-name" name="name" type="text" placeholder="Your full name" autocomplete="name" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required>
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirm-password" type="password" placeholder="Enter your password again" autocomplete="new-password" required>
            <button type="submit">Sign up</button>
            <p class="auth-switch">Already have an account? <a href="login-form.html">Log in</a></p>
        </form>
    </main>
</body>
</html>
