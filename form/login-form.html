<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Pet Store</title>
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <main class="auth-page">
        <form class="auth-form" action="../index.html">
            <h1>Welcome back</h1>
            <p class="auth-intro">Log in to your Pet Store account.</p>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Your username" autocomplete="username" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
            <button type="submit">Log in</button>
            <p class="auth-switch">New to Pet Store? <a href="signup-form.html">Create an account</a></p>
        </form>
    </main>
</body>
</html>
